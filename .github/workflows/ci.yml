name: CI

# main руу push хийх бүрд, мөн main рүү нээсэн PR бүр дээр ажиллана.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, тест, build
    runs-on: ubuntu-latest

    # Апп нь репозиторийн үндэс дээр биш, goal-app/ дотор байгаа.
    defaults:
      run:
        working-directory: goal-app

    steps:
      - name: Кодыг татах
        uses: actions/checkout@v5

      - name: Node.js тохируулах
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: goal-app/package-lock.json

      - name: Хамаарал суулгах
        run: npm ci

      - name: Lint шалгах
        run: npm run lint

      - name: Нэгж тест ажиллуулах
        run: npm test

      - name: Production build
        run: npm run build
