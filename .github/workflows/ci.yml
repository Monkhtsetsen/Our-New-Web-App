name: CI

# main руу push хийх бүрд, мөн main рүү нээсэн PR бүр дээр ажиллана.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===================================================================
  # Frontend — Next.js (goal-app/)
  # ===================================================================
  frontend:
    name: Frontend — lint, тест, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goal-app

    steps:
      - name: Кодыг татах
        uses: actions/checkout@v5

      - name: Node.js тохируулах
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: goal-app/package-lock.json

      - name: Хамаарал суулгах
        run: npm ci

      - name: Lint шалгах
        run: npm run lint

      - name: Нэгж тест
        run: npm test

      - name: Production build
        run: npm run build

  # ===================================================================
  # Backend — Node + Express (backend/)
  # ===================================================================
  backend:
    name: Backend — typecheck, тест, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Кодыг татах
        uses: actions/checkout@v5

      - name: Node.js тохируулах
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Хамаарал суулгах
        run: npm ci

      - name: Төрөл шалгах
        run: npm run typecheck

      - name: Нэгж тест
        run: npm test

      - name: Build
        run: npm run build

  # ===================================================================
  # Гурван сервисийг зэрэг асааж, бүтнээр нь шалгана.
  #
  # Энэ ажил нь frontend, backend, ӨС гурав хамтдаа ажиллаж байгааг
  # нотолно — нэгж тестээр барьж болдоггүй цорын ганц зүйл.
  # ===================================================================
  docker:
    name: Docker — гурван сервисийг бүтнээр нь шалгах
    runs-on: ubuntu-latest

    steps:
      - name: Кодыг татах
        uses: actions/checkout@v5

      - name: Docker хувилбар
        run: docker --version && docker compose version

      - name: Image-үүдийг бүтээх
        run: docker compose build 2>&1 | tee docker-build.log

      - name: Сервисүүдийг асаах
        run: docker compose up -d

      - name: Backend бэлэн болохыг хүлээх
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || true)
            if [ "$code" = "200" ]; then echo "backend /health → HTTP 200"; exit 0; fi
            sleep 3
          done
          echo "Backend хариу өгсөнгүй"; docker compose logs backend; exit 1

      - name: Frontend бэлэн болохыг хүлээх
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/register || true)
            if [ "$code" = "200" ]; then echo "frontend /register → HTTP 200"; exit 0; fi
            sleep 3
          done
          echo "Frontend хариу өгсөнгүй"; docker compose logs frontend; exit 1

      - name: Node.js тохируулах (миграц ажиллуулахад)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # drizzle-kit нь devDependency тул production image дотор байхгүй.
      # Миграцыг runner дээрээс, нээлттэй 5432 портоор дамжуулж ажиллуулна.
      - name: Схемийг ӨС рүү буулгах
        working-directory: backend
        env:
          DATABASE_URL: postgresql://goal:goal_local_dev@localhost:5432/goal_app
        run: |
          npm ci
          npx drizzle-kit migrate

      - name: ӨС рүү холбогдож чадаж байгааг шалгах
        run: |
          body=$(curl -s http://localhost:4000/health/ready)
          echo "$body"
          echo "$body" | grep -q '"database":"connected"'

      - name: Бүртгүүлэх урсгалыг бүтнээр нь шалгах
        run: |
          echo "--- 1. Зөв хүсэлт → 201 хүлээнэ ---"
          code=$(curl -s -o signup.json -w "%{http_code}" \
            -X POST http://localhost:4000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"Туршилт","contact":"test@example.com","password":"nuuts-ug-2026"}')
          cat signup.json; echo
          [ "$code" = "201" ] || { echo "ХҮЛЭЭСЭН 201, ИРСЭН $code"; exit 1; }

          echo "--- 1b. Шинэ бүртгэл \"user\" эрхтэй байх ---"
          grep -q '"role":"user"' signup.json || { echo "role буруу"; exit 1; }

          echo "--- 2. Нууц үгийн hash хариуд гарч болохгүй ---"
          grep -q "passwordHash" signup.json && { echo "hash задарлаа"; exit 1; }
          grep -q "nuuts-ug-2026" signup.json && { echo "нууц үг задарлаа"; exit 1; }

          echo "--- 3. Ижил и-мэйлээр дахин → 409 хүлээнэ ---"
          code=$(curl -s -o dup.json -w "%{http_code}" \
            -X POST http://localhost:4000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"Өөр хүн","contact":"TEST@example.com","password":"өөр-нууц-үг-2026"}')
          cat dup.json; echo
          [ "$code" = "409" ] || { echo "ХҮЛЭЭСЭН 409, ИРСЭН $code"; exit 1; }

          echo "--- 4. Буруу оролт → 400 хүлээнэ ---"
          code=$(curl -s -o bad.json -w "%{http_code}" \
            -X POST http://localhost:4000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"","contact":"abc","password":"123"}')
          cat bad.json; echo
          [ "$code" = "400" ] || { echo "ХҮЛЭЭСЭН 400, ИРСЭН $code"; exit 1; }

          echo "--- 5. Утсаар бүртгэх → 201, дугаар E.164 болсон байх ---"
          code=$(curl -s -o phone.json -w "%{http_code}" \
            -X POST http://localhost:4000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"Утастай","contact":"9911-2233","password":"nuuts-ug-2026"}')
          cat phone.json; echo
          [ "$code" = "201" ] || { echo "ХҮЛЭЭСЭН 201, ИРСЭН $code"; exit 1; }
          grep -q '"phone":"+97699112233"' phone.json || { echo "дугаар цэгцлэгдээгүй"; exit 1; }

          echo "--- 6. role-ийг хүсэлтээр админ болгох БОЛОМЖГҮЙ ---"
          curl -s -o esc.json \
            -X POST http://localhost:4000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"Заль","contact":"escalate@example.com","password":"nuuts-ug-2026","role":"admin"}'
          cat esc.json; echo
          grep -q '"role":"user"' esc.json || { echo "ЭРХ ШУРГУУЛАВ"; exit 1; }

          echo "--- 7. Хуучин /signup зам ажилласаар байх ---"
          code=$(curl -s -o alias.json -w "%{http_code}" \
            -X POST http://localhost:4000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"name":"Хуучин зам","contact":"alias@example.com","password":"nuuts-ug-2026"}')
          [ "$code" = "201" ] || { echo "/signup эвдэрсэн: $code"; exit 1; }

          echo "БҮРТГЭЛИЙН ХЭСЭГ АМЖИЛТТАЙ"

      - name: Нэвтрэх, профайлын урсгалыг бүтнээр нь шалгах
        run: |
          API=http://localhost:4000
          CONTACT=test@example.com
          PASS=nuuts-ug-2026

          echo "--- 8. Буруу нууц үг → 401 ---"
          code=$(curl -s -o wrong.json -w "%{http_code}" \
            -X POST $API/api/auth/login -H "Content-Type: application/json" \
            -d "{\"contact\":\"$CONTACT\",\"password\":\"buruu-nuuts-ug\"}")
          cat wrong.json; echo
          [ "$code" = "401" ] || { echo "ХҮЛЭЭСЭН 401, ИРСЭН $code"; exit 1; }

          echo "--- 9. Байхгүй хаягийн алдаа нь ИЖИЛ байх ---"
          curl -s -o missing.json \
            -X POST $API/api/auth/login -H "Content-Type: application/json" \
            -d '{"contact":"baihgui@example.com","password":"buruu-nuuts-ug"}'
          cat missing.json; echo
          diff wrong.json missing.json || {
            echo "АЛДААНЫ МЕССЕЖ ЯЛГААТАЙ — ямар хаяг бүртгэлтэйг таах боломжтой"
            exit 1
          }

          echo "--- 10. Зөв нэвтрэх → 200 + HttpOnly cookie ---"
          code=$(curl -s -o login.json -w "%{http_code}" -c jar.txt -D headers.txt \
            -X POST $API/api/auth/login -H "Content-Type: application/json" \
            -d "{\"contact\":\"$CONTACT\",\"password\":\"$PASS\"}")
          cat login.json; echo
          [ "$code" = "200" ] || { echo "ХҮЛЭЭСЭН 200, ИРСЭН $code"; exit 1; }
          grep -i "set-cookie" headers.txt
          grep -i "set-cookie" headers.txt | grep -qi "HttpOnly" || { echo "HttpOnly алга"; exit 1; }
          grep -i "set-cookie" headers.txt | grep -qi "SameSite=Lax" || { echo "SameSite алга"; exit 1; }
          grep -q "passwordHash" login.json && { echo "hash задарлаа"; exit 1; }

          echo "--- 11. Cookie-гүйгээр /me → 401 ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" $API/api/users/me)
          [ "$code" = "401" ] || { echo "ХАМГААЛАЛТГҮЙ БАЙНА: $code"; exit 1; }

          echo "--- 12. Cookie-тэй /me → 200 ---"
          code=$(curl -s -o me.json -w "%{http_code}" -b jar.txt $API/api/users/me)
          cat me.json; echo
          [ "$code" = "200" ] || { echo "ХҮЛЭЭСЭН 200, ИРСЭН $code"; exit 1; }
          grep -q "$CONTACT" me.json || { echo "өөр хэрэглэгч ирлээ"; exit 1; }

          echo "--- 13. Нэр солих → 200 ---"
          code=$(curl -s -o rename.json -w "%{http_code}" -b jar.txt \
            -X PUT $API/api/users/me -H "Content-Type: application/json" \
            -d '{"name":"Шинэ нэр"}')
          cat rename.json; echo
          [ "$code" = "200" ] || { echo "ХҮЛЭЭСЭН 200, ИРСЭН $code"; exit 1; }
          grep -q '"name":"Шинэ нэр"' rename.json || { echo "нэр солигдсонгүй"; exit 1; }

          echo "--- 14. PUT-ээр өөрийгөө админ болгох БОЛОМЖГҮЙ ---"
          curl -s -o escalate.json -b jar.txt \
            -X PUT $API/api/users/me -H "Content-Type: application/json" \
            -d '{"name":"Заль 2","role":"admin","level":99,"xp":100000}'
          cat escalate.json; echo
          grep -q '"role":"user"' escalate.json || { echo "ЭРХ ШУРГУУЛАВ"; exit 1; }
          grep -q '"level":1' escalate.json || { echo "ОНОО ГАРААРАА НЭМЭГДЛЭЭ"; exit 1; }

          echo "--- 15. Одоогийн нууц үггүйгээр и-мэйл солих → 400 ---"
          code=$(curl -s -o noconf.json -w "%{http_code}" -b jar.txt \
            -X PUT $API/api/users/me -H "Content-Type: application/json" \
            -d '{"email":"shine@example.com"}')
          cat noconf.json; echo
          [ "$code" = "400" ] || { echo "БАТАЛГААЖУУЛАЛТГҮЙ ӨНГӨРЛӨӨ: $code"; exit 1; }

          echo "--- 16. Буруу одоогийн нууц үгээр → 401 ---"
          code=$(curl -s -o badconf.json -w "%{http_code}" -b jar.txt \
            -X PUT $API/api/users/me -H "Content-Type: application/json" \
            -d '{"newPassword":"shine-nuuts-ug-2026","currentPassword":"buruu"}')
          [ "$code" = "401" ] || { echo "БУРУУ НУУЦ ҮГ ӨНГӨРЛӨӨ: $code"; exit 1; }

          echo "--- 17. Сүүлчийн холбоо барих хаягийг устгах БОЛОМЖГҮЙ ---"
          code=$(curl -s -o noclear.json -w "%{http_code}" -b jar.txt \
            -X PUT $API/api/users/me -H "Content-Type: application/json" \
            -d "{\"email\":\"\",\"currentPassword\":\"$PASS\"}")
          cat noclear.json; echo
          [ "$code" = "400" ] || { echo "ХОЛБОО БАРИХ ХАЯГГҮЙ ҮЛДЛЭЭ: $code"; exit 1; }

          echo "--- 18. Нууц үг солих → 200 ---"
          cp jar.txt old-jar.txt
          code=$(curl -s -o changed.json -w "%{http_code}" -b jar.txt -c jar.txt \
            -X PUT $API/api/users/me -H "Content-Type: application/json" \
            -d "{\"newPassword\":\"shine-nuuts-ug-2026\",\"currentPassword\":\"$PASS\"}")
          [ "$code" = "200" ] || { echo "ХҮЛЭЭСЭН 200, ИРСЭН $code"; exit 1; }

          echo "--- 19. ХУУЧИН token нууц үг солигдсоны дараа хүчингүй ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -b old-jar.txt $API/api/users/me)
          [ "$code" = "401" ] || {
            echo "ХУУЧИН TOKEN ХҮЧИНТЭЙ ХЭВЭЭР: $code — хулгайлагдсан сесс таслагдахгүй"
            exit 1
          }

          echo "--- 20. Шинэ cookie ажиллаж байх ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -b jar.txt $API/api/users/me)
          [ "$code" = "200" ] || { echo "өөрийн сесс тасарлаа: $code"; exit 1; }

          echo "--- 21. Хуучин нууц үгээр нэвтрэх БОЛОМЖГҮЙ ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST $API/api/auth/login -H "Content-Type: application/json" \
            -d "{\"contact\":\"$CONTACT\",\"password\":\"$PASS\"}")
          [ "$code" = "401" ] || { echo "ХУУЧИН НУУЦ ҮГ АЖИЛЛАСААР: $code"; exit 1; }

          echo "--- 22. Шинэ нууц үгээр нэвтрэх → 200 ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -c jar.txt \
            -X POST $API/api/auth/login -H "Content-Type: application/json" \
            -d "{\"contact\":\"$CONTACT\",\"password\":\"shine-nuuts-ug-2026\"}")
          [ "$code" = "200" ] || { echo "ХҮЛЭЭСЭН 200, ИРСЭН $code"; exit 1; }

          echo "--- 23. Гарсны дараа cookie хүчингүй ---"
          curl -s -o /dev/null -b jar.txt -c jar.txt -X POST $API/api/auth/logout
          code=$(curl -s -o /dev/null -w "%{http_code}" -b jar.txt $API/api/users/me)
          [ "$code" = "401" ] || { echo "ГАРСАН Ч СЕСС ҮЛДЛЭЭ: $code"; exit 1; }

          echo "НЭВТРЭХ, ПРОФАЙЛЫН ХЭСЭГ АМЖИЛТТАЙ"

      - name: Frontend-ийн хамгаалалттай замуудыг шалгах
        run: |
          WEB=http://localhost:3000
          API=http://localhost:4000

          echo "--- 24. robots.txt нь /admin-ийг хаасан байх ---"
          curl -s $WEB/robots.txt | tee robots.txt
          grep -q "Disallow: /admin" robots.txt || { echo "robots.txt буруу"; exit 1; }

          echo "--- 25. Хуучин /signup хаяг /register рүү шилжинэ ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" $WEB/signup)
          echo "HTTP $code"
          [ "$code" = "308" ] || { echo "ХҮЛЭЭСЭН 308, ИРСЭН $code"; exit 1; }

          echo "--- 26. Нэвтрээгүй бол /profile → нэвтрэх хуудас руу ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -D p.txt $WEB/profile)
          grep -i "^location:" p.txt
          [ "$code" = "307" ] || { echo "ХҮЛЭЭСЭН 307, ИРСЭН $code"; exit 1; }
          grep -i "^location:" p.txt | grep -q "/login" || { echo "буруу зам руу"; exit 1; }

          echo "--- 27. Нэвтрээгүй бол /admin → нэвтрэх хуудас руу ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" $WEB/admin)
          [ "$code" = "307" ] || { echo "ХҮЛЭЭСЭН 307, ИРСЭН $code"; exit 1; }

          # Админы хуудсыг таних тэмдэг. React нь текстийг хэд хэдэн
          # зангилаа болгон задалдаг тул тасархай бус, бүтэн өгүүлбэр
          # сонгосон нь санаатай.
          MARKER="Удирдлагын хэрэгслүүд"

          echo "--- 28. Энгийн хэрэглэгч /admin руу орвол 404 ---"
          curl -s -o /dev/null -c web-jar.txt \
            -X POST $API/api/auth/login -H "Content-Type: application/json" \
            -d '{"contact":"escalate@example.com","password":"nuuts-ug-2026"}'
          code=$(curl -s -o user-admin.html -w "%{http_code}" -b web-jar.txt $WEB/admin)
          echo "HTTP $code"
          grep -q "$MARKER" user-admin.html && {
            echo "ЭНГИЙН ХЭРЭГЛЭГЧИД АДМИНЫ АГУУЛГА ХАРАГДЛАА"
            exit 1
          }
          [ "$code" = "404" ] || { echo "ХҮЛЭЭСЭН 404, ИРСЭН $code"; exit 1; }

          echo "--- 29. /profile дээр хог cookie-гоор өгөгдөл гарахгүй ---"
          code=$(curl -s -o fake.html -w "%{http_code}" \
            -b "goal_session=forged-token-value" -D f.txt $WEB/profile)
          echo "HTTP $code"
          grep -qi "^location:.*\/login" f.txt || {
            echo "ХУУРАМЧ COOKIE-ТОЙ ХҮНИЙГ НЭВТРЭХ ХУУДАС РУУ ШИДСЭНГҮЙ"
            exit 1
          }

          echo "--- 30. ӨС дээр админ болгоод /admin нээгдэх ---"
          docker compose exec -T db psql -U goal -d goal_app -c \
            "UPDATE tb_users SET role = 'admin' WHERE email = 'escalate@example.com';"
          code=$(curl -s -o admin.html -w "%{http_code}" -b web-jar.txt $WEB/admin)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "АДМИН Ч ОРОХГҮЙ БАЙНА: $code"; exit 1; }
          grep -q "$MARKER" admin.html || { echo "админы агуулга алга"; exit 1; }
          grep -o 'name="robots" content="[^"]*"' admin.html | head -1
          grep -q 'content="noindex' admin.html || { echo "noindex алга"; exit 1; }

          echo "--- 31. Нэвтрээгүй бол /dashboard → нэвтрэх хуудас руу ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" $WEB/dashboard)
          [ "$code" = "307" ] || { echo "ХҮЛЭЭСЭН 307, ИРСЭН $code"; exit 1; }

          echo "--- 32. Нэвтэрсэн бол /dashboard нээгдэнэ ---"
          code=$(curl -s -o dash.html -w "%{http_code}" -b web-jar.txt $WEB/dashboard)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "ХҮЛЭЭСЭН 200, ИРСЭН $code"; exit 1; }
          grep -q "Түвшин" dash.html || { echo "самбарын агуулга алга"; exit 1; }

          # Энэ хуудсан дээр урьд нь зохиосон тоонууд бичигдсэн байсан.
          # Дахин орж ирэхээс сэргийлж барьж байна.
          echo "--- 33. Самбар дээр зохиосон тоо байхгүй ---"
          for fake in "Total projects" "Last activity"; do
            grep -q "$fake" dash.html && { echo "ЗОХИОСОН ӨГӨГДӨЛ: $fake"; exit 1; }
          done
          echo "зохиосон тоо олдсонгүй"

          echo "БҮГД АМЖИЛТТАЙ"

      - name: Зорилгын урсгалыг шалгах
        run: |
          API=http://localhost:4000
          WEB=http://localhost:3000

          # Хоёр ӨӨР хэрэглэгчээр нэвтэрнэ — тусгаарлалтыг шалгахад хэрэгтэй.
          curl -s -o /dev/null -c ann.txt             -X POST $API/api/auth/login -H "Content-Type: application/json"             -d '{"contact":"alias@example.com","password":"nuuts-ug-2026"}'
          curl -s -o /dev/null -c bob.txt             -X POST $API/api/auth/login -H "Content-Type: application/json"             -d '{"contact":"escalate@example.com","password":"nuuts-ug-2026"}'

          echo "--- 34. Нэвтрээгүй бол 401 ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" $API/api/goals)
          [ "$code" = "401" ] || { echo "ХАМГААЛАЛТГҮЙ: $code"; exit 1; }

          echo "--- 35. Зорилго үүсгэх → 201 ---"
          code=$(curl -s -o g1.json -w "%{http_code}" -b ann.txt             -X POST $API/api/goals -H "Content-Type: application/json"             -d '{"title":"Хагас марафон гүйх","description":"Намар 21 км"}')
          cat g1.json; echo
          [ "$code" = "201" ] || { echo "ХҮЛЭЭСЭН 201, ИРСЭН $code"; exit 1; }
          grep -q '"status":"in_progress"' g1.json || { echo "анхны төлөв буруу"; exit 1; }
          grep -q '"category":"personal"' g1.json || { echo "анхны ангилал буруу"; exit 1; }

          echo "--- 36. Үүсгэсэн зорилго жагсаалтад гарна ---"
          curl -s -b ann.txt $API/api/goals -o list.json
          grep -q "Хагас марафон гүйх" list.json || { echo "жагсаалтад алга"; exit 1; }

          echo "--- 37. Нэргүй → 400 ---"
          code=$(curl -s -o bad.json -w "%{http_code}" -b ann.txt             -X POST $API/api/goals -H "Content-Type: application/json" -d '{"title":"  "}')
          [ "$code" = "400" ] || { echo "ХҮЛЭЭСЭН 400, ИРСЭН $code"; exit 1; }

          # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          # ХАМГИЙН ЧУХАЛ ШАЛГАЛТ.
          #
          # Нэг хэрэглэгч нөгөөгийнхөө өгөгдлийг харах нь OWASP-ийн API
          # жагсаалтын нэгдүгээр алдаа. `where(userId = ...)` нэг мартахад
          # шууд үүснэ — тиймээс машинаар барина.
          # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          echo "--- 38. Өөр хэрэглэгчийн зорилго ХАРАГДАХГҮЙ ---"
          curl -s -b bob.txt $API/api/goals -o bob-list.json
          cat bob-list.json; echo
          grep -q "Хагас марафон гүйх" bob-list.json && {
            echo "ӨГӨГДӨЛ ЗАДАРЛАА — өөр хэрэглэгчийн зорилго харагдав"
            exit 1
          }
          grep -q '"goals":\[\]' bob-list.json || { echo "хоосон жагсаалт хүлээсэн"; exit 1; }

          echo "--- 39. userId-г хүсэлтээр тогтоох БОЛОМЖГҮЙ ---"
          ANN_ID=$(grep -o '"id":"[^"]*"' g1.json | head -1 | cut -d'"' -f4)
          curl -s -o esc.json -b bob.txt             -X POST $API/api/goals -H "Content-Type: application/json"             -d '{"title":"Залилан","userId":"'"$ANN_ID"'","status":"completed","id":"00000000-0000-0000-0000-000000000000"}'
          cat esc.json; echo
          grep -q '"status":"in_progress"' esc.json || { echo "ТӨЛӨВИЙГ ХҮСЭЛТЭЭР ТОГТООВ"; exit 1; }
          grep -q '"id":"00000000-0000-0000-0000-000000000000"' esc.json && {
            echo "ID-Г ХҮСЭЛТЭЭР ТОГТООВ"; exit 1; }
          # Энэ зорилго bob-д л харагдана, ann-д биш.
          curl -s -b ann.txt $API/api/goals | grep -q "Залилан" && {
            echo "ӨӨР ХЭРЭГЛЭГЧИЙН НЭР ДЭЭР БИЧИГДЭВ"; exit 1; }

          echo "--- 40. Frontend /goals — нэвтрээгүй бол нэвтрэх хуудас руу ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" $WEB/goals)
          [ "$code" = "307" ] || { echo "ХҮЛЭЭСЭН 307, ИРСЭН $code"; exit 1; }

          echo "--- 41. Frontend /goals — нэвтэрсэн бол зорилго харагдана ---"
          code=$(curl -s -o goals.html -w "%{http_code}" -b ann.txt $WEB/goals)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "ХҮЛЭЭСЭН 200, ИРСЭН $code"; exit 1; }
          grep -q "Хагас марафон гүйх" goals.html || { echo "зорилго хуудсан дээр алга"; exit 1; }

          echo "ЗОРИЛГЫН ХЭСЭГ АМЖИЛТТАЙ"

      - name: Сервисүүдийн лог
        if: always()
        run: docker compose logs --no-color | tee docker-run.log

      - name: Layer caching — кодод жижиг өөрчлөлт оруулаад дахин build
        run: |
          echo "" >> goal-app/app/page.tsx
          echo "// layer caching-ийг шалгах зорилгоор нэмсэн мөр" >> goal-app/app/page.tsx
          docker compose build frontend 2>&1 | tee docker-rebuild.log
          echo "Кэшнээс ирсэн алхам: $(grep -c 'CACHED' docker-rebuild.log || echo 0)"

      - name: Логуудыг хадгалах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            docker-build.log
            docker-run.log
            docker-rebuild.log

      - name: Цэвэрлэх
        if: always()
        run: docker compose down -v
