# Goal App — гурван сервисийг зэрэг ажиллуулна.
#
#   docker compose up --build
#
#   frontend   http://localhost:3000     Next.js
#   backend    http://localhost:4000     Node + Express
#   db         localhost:5432            PostgreSQL 17
#
# Схемийг ӨС рүү буулгах (эхний удаа нэг л удаа):
#   docker compose exec backend npx drizzle-kit migrate

services:
  db:
    image: postgres:17-alpine
    container_name: goal-app-db
    environment:
      # ЗӨВХӨН ЛОКАЛ ХӨГЖҮҮЛЭЛТЭД. Үйлдвэрлэлийн орчинд энэ утгыг
      # хэзээ ч ашиглахгүй — Supabase өөрийн нууц үгийг өгнө.
      POSTGRES_USER: goal
      POSTGRES_PASSWORD: goal_local_dev
      POSTGRES_DB: goal_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "Процесс асав" биш "хүсэлт хүлээж авахад бэлэн" гэдгийг шалгана.
      test: ["CMD-SHELL", "pg_isready -U goal -d goal_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: goal-app-backend
    ports:
      - "4000:4000"
    environment:
      # Хост нь "localhost" биш "db". Контейнер бүр өөрийн сүлжээний
      # орон зайтай тул localhost нь backend-ийн өөрийнх нь контейнерийг
      # заана. Compose сервисийн нэрийг DNS болгож өгдөг.
      DATABASE_URL: postgresql://goal:goal_local_dev@db:5432/goal_app
      PORT: "4000"
      # Хөтөч frontend-ээс хандах тул түүний хаягийг зөвшөөрнө.
      CORS_ORIGINS: http://localhost:3000
      NODE_ENV: production

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # ЗӨВХӨН ЛОКАЛ ХӨГЖҮҮЛЭЛТЭД ЗОРИУЛСАН УТГУУД.
      #
      # Жинхэнэ сервер дээр эдгээрийг энд бичихгүй — нууц хадгалах
      # үйлчилгээнээс (GitHub Secrets, Kubernetes Secret, Supabase
      # тохиргоо) өгнө. Энэ файл нь git дотор байдаг тул энд бичсэн
      # утга нийтэд ил болно.
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      JWT_SECRET: local-development-only-not-a-real-secret-0123456789

      # NODE_ENV=production атлаа энд false байгаа нь санаатай:
      # локал дээр http://localhost ажилладаг бөгөөд `secure` cookie
      # нь зөвхөн HTTPS-ээр явдаг. True орхивол нэвтрэх боломжгүй.
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./goal-app
      args:
        # ХӨТЧӨӨС харагдах хаяг. "http://backend:4000" гэж бичвэл
        # ажиллахгүй — тэр нэр зөвхөн Docker-ийн сүлжээн дотор утгатай,
        # хэрэглэгчийн хөтөч түүнийг олохгүй.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: goal-app-frontend
    ports:
      - "3000:3000"
    environment:
      # Next.js-ийн СЕРВЕР талаас backend руу хандах хаяг. Дээрх
      # NEXT_PUBLIC_API_URL-аас ЯЛГААТАЙ: тэр нь хөтчөөс, энэ нь
      # контейнер дотроос хандана. NEXT_PUBLIC_ угтваргүй тул
      # хөтөч рүү дамжихгүй.
      BACKEND_INTERNAL_URL: http://backend:4000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
